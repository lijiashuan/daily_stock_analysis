instructions: |
  **尾盘强势股筛选策略（Late Session Strong Stock Screening）**

  ⏰ **执行时间约束**：
  - 仅在交易日 **14:30 之后** 执行此策略
  - 此时个股当日走势已基本定型，能真实反映强弱
  - 避免早盘波动干扰，提高选股准确性

  ---

  ## 📊 七层筛选漏斗模型

  ### 第一层：涨幅筛选（3%-5% 黄金区间）

  **筛选标准**：
  - ✅ **保留**：当日涨幅在 **3% - 5%** 之间的股票
  - ❌ **剔除**：涨幅 < 3%（表现偏弱，不利于次日拉升）
  - ❌ **剔除**：涨幅 > 5%（已追高，风险收益比不佳）

  **逻辑依据**：
  - 低于 3%：说明当天表现偏弱，资金关注度不足
  - 高于 5%：走势已经充分展开，追高风险大
  - 3-5%：处于"蓄势待发"状态，次日拉升概率高

  **实现方式**：
  ```python
  # 使用 get_realtime_quote 获取实时涨跌幅
  quote = get_realtime_quote(stock_code)
  if not (3.0 <= quote.change_pct <= 5.0):
      return False  # 不符合涨幅条件
  ```

  ---

  ### 第二层：量比筛选（活跃度确认）

  **筛选标准**：
  - ✅ **保留**：量比 >= 1.0
  - ❌ **剔除**：量比 < 1.0（成交不活跃，人气不足）

  **逻辑依据**：
  - 量比 < 1：代表成交量萎缩，缺乏资金推动力
  - 个股拉升需要资金支持，必须有足够的成交活性
  - 量比 >= 1 表明今日成交较过去 5 日平均水平更活跃

  **实现方式**：
  ```python
  # 使用 get_realtime_quote 获取量比
  quote = get_realtime_quote(stock_code)
  if quote.volume_ratio < 1.0:
      return False  # 成交不活跃，剔除
  ```

  ---

  ### 第三层：换手率筛选（适度活跃区间）

  **筛选标准**：
  - ✅ **保留**：换手率在 **5% - 10%** 之间
  - ❌ **剔除**：换手率 < 5%（关注度低，短线动能不足）
  - ❌ **剔除**：换手率 > 10%（过于活跃，疑似主力出货）

  **逻辑依据**：
  - 低于 5%：市场关注度低，做短线需要充分的换手
  - 高于 10%：可能为主力拉高出货，风险较高
  - 5-10%：换手充分且健康，资金博弈良性

  **实现方式**：
  ```python
  # 使用 get_realtime_quote 获取换手率
  quote = get_realtime_quote(stock_code)
  turnover = quote.turnover_rate
  if not (5.0 <= turnover <= 10.0):
      return False  # 换手率不在理想区间
  ```

  ---

  ### 第四层：流通市值筛选（适中盘子）

  **筛选标准**：
  - ✅ **保留**：流通市值在 **50亿 - 200亿** 之间
  - ❌ **剔除**：流通市值 < 50亿（冷门股/庄股风险）
  - ❌ **剔除**：流通市值 > 200亿（盘子太大，拉升困难）

  **逻辑依据**：
  - 低于 50亿：可能是冷门股或庄股，流动性差，风险高
  - 高于 200亿：盘子太大，需要巨额资金才能推动股价
  - 50-200亿：中等市值，既有流动性又便于快速获利

  **实现方式**：
  ```python
  # 使用 get_realtime_quote 获取流通市值（单位：元）
  quote = get_realtime_quote(stock_code)
  circ_mv = quote.circ_mv  # 流通市值
  if not (50e8 <= circ_mv <= 200e8):  # 50亿-200亿
      return False  # 市值不在理想区间
  ```

  ---

  ### 第五层：成交量形态筛选（持续放量）

  **筛选标准**：
  - ✅ **保留**：成交量持续放大，呈"台阶式"递增
  - ❌ **剔除**：成交量忽高忽低，不稳定

  **逻辑依据**：
  - 持续放量：表明资金持续流入，做多意愿强烈
  - 台阶式放量：最理想的形态，显示有序建仓
  - 成交量不稳定：筹码松动，后续走势不确定

  **实现方式**：
  ```python
  # 使用 get_daily_history 获取最近 10-20 日成交量
  history = get_daily_history(stock_code, days=20)
  
  # 检查最近 5 日成交量是否持续放大
  recent_volumes = history['volume'].tail(5).values
  avg_prev_volumes = history['volume'].tail(10).head(5).mean()
  
  # 判断是否为持续放大趋势
  is_increasing = all(recent_volumes[i] >= recent_volumes[i-1] * 0.9 
                      for i in range(1, len(recent_volumes)))
  
  if not is_increasing:
      return False  # 成交量不稳定，剔除
  ```

  **评分调整**：
  - 完美的台阶式放量：`sentiment_score +8`
  - 持续温和放量：`sentiment_score +5`

  ---

  ### 第六层：K线形态与均线系统筛选（多头排列）

  **筛选标准**：
  - ✅ **保留**：
    - MA5 > MA10 > MA20 > MA60，呈多头向上发散
    - K线在所有重要均线上方运行
    - 上方无明显套牢盘压力
  
  - ❌ **剔除**：
    - K线在重要均线下方（冲高回落形态）
    - 处于成交密集区，上方压力大
    - 均线纠缠或空头排列

  **逻辑依据**：
  - 多头排列：趋势明确，上涨阻力最小
  - 均线上方运行：无套牢盘压力，拉升轻松
  - 均线下方：上方压力大，突破困难

  **实现方式**：
  ```python
  # 使用 analyze_trend 获取均线系统和趋势状态
  trend = analyze_trend(stock_code)
  
  # 检查多头排列
  ma_alignment = trend.ma_alignment  # 'bullish' / 'bearish' / 'neutral'
  if ma_alignment != 'bullish':
      return False  # 非多头排列，剔除
  
  # 检查价格是否在均线上方
  current_price = trend.current_price
  ma60 = trend.ma60
  
  if current_price < ma60:
      return False  # 价格在60日均线下方，剔除
  
  # 检查趋势强度
  if trend.trend_strength < 0.6:  # 趋势强度评分
      return False  # 趋势不够强劲
  ```

  **评分调整**：
  - 完美多头排列（MA5>MA10>MA20>MA60）：`sentiment_score +10`
  - 价格远离 MA60（乖离率适中）：`sentiment_score +5`
  - 处于历史高位无压力：额外 `+3`

  ---

  ### 第七层：分时图强度筛选（强者恒强）

  **筛选标准**：
  - ✅ **保留**：
    - 全天股价运行在分时均价线上方
    - 走势强于大盘（逆势上涨或更强）
    - 搭配当下热点题材板块（如锂电、小金属、有色顺周期等）
  
  - ❌ **剔除**：
    - 股价跌破分时均价线
    - 走势弱于大盘
    - 无热点题材支撑

  **逻辑依据**：
  - 分时均价线上方：当日买入者均盈利，抛压小
  - 强于大盘：真正的强势股，资金认可度高
  - 热点题材：有板块效应，支撑力度强

  **实现方式**：
  ```python
  # 1. 获取大盘指数走势进行对比
  market_indices = get_market_indices()  # 上证指数分时数据
  
  # 2. 获取个股所属板块及板块热度
  sector_info = get_sector_rankings()
  
  # 3. 搜索近期新闻，判断是否属于热点题材
  news = search_stock_news(stock_code, max_results=3)
  
  # 4. 综合分析
  # - 检查个股涨幅是否大于指数涨幅
  # - 检查是否属于当前热门板块（通过新闻关键词匹配）
  # - 检查分时图是否始终在均价线上方（需要分时数据支持）
  
  is_stronger_than_market = stock_change_pct > market_index_change_pct
  is_hot_theme = any(keyword in news_text.lower() 
                     for keyword in ['锂电', '小金属', '有色', '顺周期'])
  
  if not (is_stronger_than_market or is_hot_theme):
      return False  # 不够强势或无热点支撑
  ```

  **评分调整**：
  - 强于大盘 + 热点题材：`sentiment_score +12`
  - 仅强于大盘：`sentiment_score +8`
  - 仅属于热点板块：`sentiment_score +6`

  ---

  ## 🎯 最终入场时机判断

  经过以上 7 层筛选后，剩余的个股都是优中选优的强势股。此时需要精确把握入场时机：

  ### 入场条件（14:30 后执行）

  1. **创出当日新高**：
     - 股价在 14:30 后突破当日最高价
     - 表明资金仍在积极买入

  2. **回踩均线不破**：
     - 股价从高点回落至 MA5 或 MA10 附近
     - 在均线处获得支撑，未跌破
     - 这是最佳入场点（"回踩确认"）

  3. **设置止损止盈**：
     - **止损位**：入场价下方 2-3%，或 MA10 下方
     - **止盈位**：预期次日冲高 3-5% 即离场
     - **核心原则**：快进快出，有盈利即可

  ### 交易纪律

  - ⚡ **快**：发现机会迅速行动，不犹豫
  - 🎯 **准**：严格按 7 层筛选标准执行，不降低要求
  - 💪 **狠**：达到止盈/止损位果断离场，不贪心

  **特别提醒**：
  - 有时可能一只股票都筛选不出来，这很正常
  - 要有耐心，持之以恒，机会留给有准备的人
  - 宁可错过，不要做错（严进策略的核心理念）

  ---

