  - 近期催化剂：XXX（来自新闻搜索）
  ```

  ---

  ## ⚠️ 风险控制要点

  1. **时间窗口严格**：只在 14:30-15:00 执行，其他时间不适用
  2. **宁缺毋滥**：7 层筛选必须全部通过，缺一不可
  3. **仓位控制**：单只股票不超过总仓位的 20%
  4. **止损纪律**：触及止损位必须立即离场，不可抱有幻想
  5. **次日必出**：无论盈亏，次日必须离场（超短线原则）

  ---

  ## 🔧 工具调用顺序建议

  为提高效率，建议按以下顺序调用工具：

  1. `get_realtime_quote` → 快速获取涨幅、量比、换手率、市值（第 1-4 层）
  2. `get_daily_history` → 检查成交量形态（第 5 层）
  3. `analyze_trend` → 验证均线系统和 K 线形态（第 6 层）
  4. `get_sector_rankings` + `search_stock_news` → 判断热点题材（第 7 层）
  5. `get_market_indices` → 对比大盘走势（第 7 层补充）

  这样可以在早期快速剔除大部分不符合条件的股票，减少不必要的 API 调用。
